steps:
  - name: gcr.io/cloud-builders/mvn
    args: ["clean", "package"]

  - name: gcr.io/cloud-builders/gcloud
    args:
      [
        "run",
        "deploy",
        "addtwonumber",
        "--source=.",
        "--region=us-central1",
        "--allow-unauthenticated"
      ]

images:
  - "gcr.io/$PROJECT_ID/addtwonumber"
